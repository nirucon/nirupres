name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Release gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Version identity
        run: |
          version=$(sed -n 's/^VERSION="\(.*\)"/\1/p' install.sh | head -1)
          test -n "$version"
          test "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' nirupres/__init__.py)" = "$version"
          test "$(grep -o "VERSION = \"[0-9.]*\"" nirupres/foundation.py | head -1 | cut -d'"' -f2)" = "$version"
          test "$(sed -n 's/^EXPECTED_VERSION = "\(.*\)"/\1/p' tests/release_gate.py)" = "$version"
      - name: Shell syntax
        run: for f in install.sh run.sh scripts/test.sh; do sh -n "$f"; done
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install -r requirements.txt
      - run: python3 -m compileall -q nirupres tests
      - run: QT_QPA_PLATFORM=offscreen PYTHONPATH=. python3 tests/release_gate.py
