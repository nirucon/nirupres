name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install X11 test tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils fonts-noto-core fonts-noto-mono fonts-dejavu-core python3
      - run: sh -n install.sh && sh -n uninstall.sh && sh tests/uninstall_test.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: ./target/release/nirupres --self-test-fit
      - run: sh tests/xvfb.sh target/release/nirupres
