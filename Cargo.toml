[package]
name = "nirupres"
version = "3.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Minimal, keyboard-oriented presentation studio for X11"

[dependencies]
x11rb = { version = "0.13", features = ["shm", "randr", "composite"] }
ttf-parser = "0.25"
rustybuzz = "0.20"
ab_glyph_rasterizer = "0.1"
unicode-linebreak = "0.1"
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
image-webp = "0.2"
miniz_oxide = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1
